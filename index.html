<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>華語文閱讀測驗練習站｜入門基礎級</title>
<meta name="description" content="華語文閱讀測驗（Test of Chinese as a Foreign Language: Reading）入門基礎級線上練習：分題型練習、模擬測驗、錯題本與學習紀錄。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6b66'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif'%3E華%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface2:#eef1ef; --ink:#1d2a2a; --ink2:#4a5b5a; --ink3:#7b8b8a;
  --line:#d9dfdd; --brand:#0f6b66; --brand-ink:#ffffff; --brand-soft:#dcefed; --accent:#b4531a;
  --ok:#1c7d43; --ok-bg:#dff3e6; --bad:#b3261e; --bad-bg:#fbe3e0; --warn-bg:#fff3d6;
  --shadow:0 1px 2px rgba(20,40,40,.06),0 4px 14px rgba(20,40,40,.06);
  --r:14px; --maxw:920px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101716; --surface:#182220; --surface2:#1f2c2a; --ink:#e7efee; --ink2:#b4c3c1; --ink3:#8a9b99;
    --line:#2c3b39; --brand:#4fb8b0; --brand-ink:#08211f; --brand-soft:#1b3a38; --accent:#e0915a;
    --ok:#66d08f; --ok-bg:#183a27; --bad:#ff8c84; --bad-bg:#421e1b; --warn-bg:#3b3116;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#101716; --surface:#182220; --surface2:#1f2c2a; --ink:#e7efee; --ink2:#b4c3c1; --ink3:#8a9b99;
  --line:#2c3b39; --brand:#4fb8b0; --brand-ink:#08211f; --brand-soft:#1b3a38; --accent:#e0915a;
  --ok:#66d08f; --ok-bg:#183a27; --bad:#ff8c84; --bad-bg:#421e1b; --warn-bg:#3b3116;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;margin-right:auto}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:19px;font-weight:700}
.brand small{display:block;font-weight:400;color:var(--ink3);font-size:.72rem;line-height:1.2}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main a{padding:8px 12px;border-radius:9px;text-decoration:none;color:var(--ink2);font-size:.95rem}
nav.main a:hover{background:var(--surface2)}
nav.main a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:.9rem;color:var(--ink2)}
.iconbtn:hover{background:var(--surface2)}

main{padding:24px 0 64px;min-height:70vh}
h1{font-size:1.7rem;line-height:1.3;margin:0 0 6px}
h2{font-size:1.2rem;margin:28px 0 12px}
h3{font-size:1.05rem;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--ink3)}
.sub{color:var(--ink2)}

/* hero */
.hero{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#0b2a3a));color:var(--brand-ink);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow)}
.hero h1{color:inherit;font-size:1.75rem}
.hero p{opacity:.92;max-width:60ch}
.hero .stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px}
.hero .stats b{display:block;font-size:1.55rem;line-height:1.2}
.hero .stats span{font-size:.85rem;opacity:.85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{color:#e8fbf9;background:linear-gradient(135deg,#14524e,#12303f)}}
:root[data-theme="dark"] .hero{color:#e8fbf9;background:linear-gradient(135deg,#14524e,#12303f)}

/* cards */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;transition:transform .12s,border-color .12s}
.tcard:hover{transform:translateY(-2px);border-color:var(--brand)}
.tcard .tag{font-size:.75rem;color:var(--brand);font-weight:600;letter-spacing:.02em}
.tcard .zh{font-size:1.2rem;font-weight:700;line-height:1.35}
.tcard .en{font-size:.85rem;color:var(--ink3)}
.tcard .desc{font-size:.9rem;color:var(--ink2);flex:1}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.ok>i{background:var(--ok)}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 18px;font-weight:600;min-height:44px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* forms */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 16px;min-height:42px;border-right:1px solid var(--line);color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.field{margin:0 0 18px}
.field>label,.field>.lbl{display:block;font-weight:600;margin-bottom:8px}

/* breadcrumb */
.crumb{font-size:.9rem;margin-bottom:12px}
.crumb a{color:var(--ink3);text-decoration:none}
.crumb a:hover{color:var(--brand)}

/* question area */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qhead .cnt{font-weight:700;white-space:nowrap}
.qhead .bar{flex:1}
.qcard{padding:18px}
.imgcard{background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--line);overflow:hidden}
.imgcard img{max-width:100%;height:auto;display:inline-block;vertical-align:top}
.qrow{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.qrow:first-of-type{border-top:0;padding-top:0}
.qlabel{font-weight:700;margin-right:10px}
.letters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbtn{min-width:56px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem;padding:0 14px;transition:background .1s,border-color .1s}
.lbtn:hover:not([disabled]){border-color:var(--brand);background:var(--brand-soft)}
.lbtn.sel{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.lbtn.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.lbtn.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.lbtn[disabled]{cursor:default}
.lbtn.dim{opacity:.55}
.fb{font-size:.92rem;margin-left:4px;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}

.optlist{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:46px;transition:background .1s,border-color .1s}
.opt b{min-width:1.6em;color:var(--brand)}
.opt:hover:not([disabled]){border-color:var(--brand);background:var(--brand-soft)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct b{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong b{color:var(--bad)}
.opt[disabled]{cursor:default}
.opts-inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}

.passage{font-size:1.1rem;line-height:2;background:var(--surface2);border-radius:12px;padding:14px 18px;margin-bottom:12px;text-align:justify}
.stem{font-size:1.1rem;font-weight:600;margin:6px 0}
.gstem{font-size:1.1rem;line-height:1.9}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink3);text-align:center;margin:0 3px;padding:0 4px;font-weight:600}
.blank.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.blank.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.blank.fix{color:var(--ok);border-color:var(--ok);background:var(--ok-bg);text-decoration:none}
.slot{display:inline-block;min-width:3.2em;padding:0 8px;margin:0 3px;border-radius:8px;border:2px dashed var(--ink3);text-align:center;font-weight:600;font-size:.98rem;line-height:1.7}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.optbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;background:var(--surface2);border-radius:12px;padding:12px 16px;margin:12px 0}
.optbox div b{color:var(--brand);margin-right:8px}
.qnav{display:flex;gap:10px;margin-top:16px;align-items:center}

/* summary */
.score{font-size:2.6rem;font-weight:800;line-height:1.1;color:var(--brand)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.95rem}
th{color:var(--ink3);font-weight:600;font-size:.85rem}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.8rem;background:var(--surface2);color:var(--ink2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}

/* mock */
.examtop{position:sticky;top:56px;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.25rem}
.timer.low{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{min-width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;text-decoration:none;color:var(--ink2);display:grid;place-items:center;padding:0 4px}
.chip.done{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.parthead{background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:8px 14px;margin:22px 0 10px;font-weight:700}
.qs-list{display:grid;gap:10px;margin-top:14px}
.qs-list .qr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qs-list .qr .no{min-width:3.4em;font-weight:700}

.notice{background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-size:.92rem}
.empty{text-align:center;padding:36px 16px;color:var(--ink3)}
footer.foot{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--ink3);font-size:.85rem}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:22px;max-width:min(92vw,420px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.zoomdlg{max-width:96vw;width:96vw;padding:10px;background:var(--surface)}
.zoomwrap{overflow:auto;max-height:calc(100vh - 100px);background:#fff;border-radius:8px;-webkit-overflow-scrolling:touch}
.zoomwrap img{display:block;max-width:none;height:auto}
.imgcard{cursor:zoom-in}
.hidden{display:none!important}
@media (max-width:560px){
  h1{font-size:1.4rem}.hero{padding:22px 18px}.hero h1{font-size:1.45rem}
  nav.main a{padding:7px 9px;font-size:.88rem}
  .brand small{display:none}
  .lbtn{min-width:52px}
}
.lbtn.sel:hover:not([disabled]){background:var(--brand);border-color:var(--brand)}
.opt.sel:hover:not([disabled]){background:var(--brand-soft)}
header.top .wrap{max-width:1120px}
@media (max-width:1060px){.brand small{display:none}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.split .qs-list{position:sticky;top:var(--sticky,76px);margin-top:0;gap:0;background:var(--surface2);border-radius:12px;padding:8px 12px}
.split .qrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:0;padding:7px 0;border-top:1px dashed var(--line)}
.split .qrow:first-child{border-top:0}
.split .qlabel{min-width:2.4em;margin-right:0;line-height:38px}
.split .qrow{align-items:flex-start}
.qs-list .qr .fb{flex-basis:100%;margin:0}
.split .letters{gap:5px}
.split .lbtn{min-width:32px;min-height:38px;padding:0 4px;font-size:.95rem;border-radius:9px;border-width:2px}
.split .fb{flex-basis:100%;margin:0 0 0 2.8em;font-size:.82rem}
@media (max-width:900px){.split{display:block}.split .qs-list{position:static;margin-top:14px;background:transparent;padding:0}
  .split .qrow{display:block;padding:14px 0}.split .lbtn{min-width:52px;min-height:48px;font-size:1.05rem}.split .fb{margin:0 0 0 4px;font-size:.92rem}}
body.exam{--sticky:126px}
.chipcard{padding:10px 14px;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="wrap">

<dialog id="zoom" class="zoomdlg"></dialog>

<script src="data/questions.js"></script>

function record(item,results){
  const r=DB.records[item.key]||(DB.records[item.key]={n:0,ok:0});
  r.n++; if(results.every(Boolean)) r.ok++;
  r.last=results; r.at=Date.now(); delete r.dismissed; save();
}
const isWrong=k=>{const r=DB.records[k];return !!r&&!r.dismissed&&r.last&&!r.last.every(Boolean)};
const wrongItems=type=>ALLITEMS.filter(i=>(!type||i.type===type)&&isWrong(i.key));
function typeStats(type){
  const list=ITEMS[type];let a=0,n=0,ok=0;
  list.forEach(i=>{const r=DB.records[i.key];if(r&&r.n){a++;n+=r.n;ok+=r.ok}});
  return{total:list.length,practiced:a,acc:n?Math.round(ok*100/n):null};
}

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")el.className=v;else if(k==="html")el.innerHTML=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="dataset")Object.assign(el.dataset,v);else el.setAttribute(k,v===true?"":v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}
  return el;
}

/* ================= question renderer =================
   mode: "practice" (lock + feedback) | "exam" (select, changeable, no feedback) | "review" (locked, shows both)
*/
function letterRow(q,st,i,mode,onPick,withText){
  const wrap=h("div",{class:withText?"optlist":"letters"});
  const btns=[];
  for(const L of q.letters){
    const txt=withText?q.opts[L]:null;
    const b=withText?h("button",{type:"button",class:"opt","data-l":L},h("b",null,L+"."),h("span",null,txt))
                    :h("button",{type:"button",class:"lbtn","data-l":L,"aria-label":L},L);
    b.addEventListener("click",()=>onPick(i,L));btns.push(b);wrap.append(b);
  }
  const fb=h("div",{class:"fb","aria-live":"polite"});
  const paint=()=>{
    const sel=st.sel[i],locked=(mode!=="exam")&&(mode==="review"||sel!=null);
    btns.forEach(b=>{
      const L=b.dataset.l;b.classList.remove("sel","correct","wrong","dim");b.disabled=(mode==="review")||(mode==="practice"&&sel!=null);
      const base=withText?"opt":"lbtn";
      if(mode==="exam"){if(sel===L)b.classList.add("sel")}
      else if(sel!=null||mode==="review"){
        if(L===q.ans)b.classList.add("correct");
        else if(L===sel)b.classList.add("wrong");
        else if(!withText)b.classList.add("dim");
      }
      b.setAttribute("aria-pressed",sel===L?"true":"false");
    });
    fb.className="fb";fb.textContent="";
    if(mode!=="exam"&&sel!=null){const ok=sel===q.ans;fb.classList.add(ok?"ok":"bad");fb.textContent=ok?t("correct"):t("wrong_ans",{a:q.ans})}
    else if(mode==="review"&&sel==null){fb.classList.add("bad");fb.textContent=t("m_blank")+"｜"+t("m_right")+" "+q.ans}
  };
  return{el:wrap,paint,fb};
}

/* renders one item into container; returns controller {paints, focusFirst} */
function renderItem(item,st,mode,onAnswer){
  const root=h("div",{class:"card qcard"});
  const paints=[];
  const pick=(i,L)=>{
    if(mode==="review")return;
    if(mode==="practice"&&st.sel[i]!=null)return;
    if(mode==="exam"&&st.sel[i]===L)st.sel[i]=null;else st.sel[i]=L;
    paints.forEach(p=>p());onAnswer&&onAnswer(i,L);
  };
  const addRow=(q,i,labelText,withText,into)=>{
    const lr=letterRow(q,st,i,mode,pick,withText);paints.push(lr.paint);
    if(withText)into.append(lr.el,lr.fb);
    else{into.append(h("div",{class:"qrow"},labelText?h("span",{class:"qlabel"},labelText):null,lr.el,lr.fb))}
    lr.paint();
  };
  if(item.kind==="img"){
    const box=h("div",{class:"qs-list"});
    const wide=item.qs.length>1;
    item.qs.forEach((q,i)=>{
      const label=item.single?null:(wide?q.label:(item.type==="mock"?t("part_q",{n:q.label}):q.label));
      addRow(q,i,label,false,box);
    });
    if(wide)root.append(h("div",{class:"split"},imgEl(item),box));else root.append(imgEl(item),box);
  }else if(item.kind==="reading"){
    root.append(h("div",{class:"passage"},item.passage),h("div",{class:"stem"},item.stem));
    const q=item.qs[0];q.opts=item.opts;addRow(q,0,null,true,root);
  }else if(item.kind==="gap"){
    if(item.img)root.append(imgEl(item),h("div",{style:"height:12px"}));
    item.qs.forEach((q,i)=>{
      const blank=h("span",{class:"blank"},"　");
      const parts=q.stem.split("＿＿＿＿");
      const stem=h("div",{class:"gstem"},h("span",{class:"qlabel"},q.label+"."));
      const blanks=[];
      parts.forEach((p,k)=>{stem.append(p);if(k<parts.length-1){const b=h("span",{class:"blank"},"　");blanks.push(b);stem.append(b)}});
      const sec=h("div",{class:"qrow"},stem);
      const lr=letterRow(q,st,i,mode,pick,true);
      // inline options grid (letter + text)
      lr.el.className="opts-inline";
      sec.append(lr.el);root.append(sec);
      const paintBlank=()=>{
        const sel=st.sel[i];
        blanks.forEach((b,k)=>{
          b.className="blank";b.textContent="　";
          if(sel!=null){
            const txt=q.opts[sel].split("…");const ok=sel===q.ans;
            const use=q.opts[sel].includes("…")?(q.opts[sel].split("…")[k]||""):q.opts[sel];
            const good=q.opts[q.ans].includes("…")?(q.opts[q.ans].split("…")[k]||""):q.opts[q.ans];
            b.classList.add(ok?"ok":"bad");b.textContent=use||"　";
            if(!ok){b.after(h("span",{class:"blank fix","data-fix":"1"},good))}
          }
        });
      };
      const wrapPaint=()=>{sec.querySelectorAll('[data-fix]').forEach(x=>x.remove());lr.paint();paintBlank()};
      paints.push(wrapPaint);wrapPaint();
      // add feedback line
      sec.append(lr.fb);
    });
  }else if(item.kind==="para"){
    const pas=h("div",{class:"passage"});
    const slots=[];
    item.passage.split(/（(\d)）/).forEach((seg,k)=>{
      if(k%2===0)pas.append(seg);else{const s=h("span",{class:"slot"},"（"+seg+"）");slots[+seg-1]=s;pas.append(s)}
    });
    root.append(pas);
    const box=h("div",{class:"optbox"});
    Object.keys(item.opts).forEach(L=>box.append(h("div",null,h("b",null,L+"."),item.opts[L])));
    root.append(box);
    const list=h("div",{class:"qs-list"});
    item.qs.forEach((q,i)=>{
      const lr=letterRow(q,st,i,mode,pick,false);
      const row=h("div",{class:"qr"},h("span",{class:"no"},q.label),lr.el,lr.fb);list.append(row);
      const p=()=>{
        lr.paint();const s=slots[i],sel=st.sel[i];if(!s)return;
        s.className="slot";s.textContent="（"+(i+1)+"）";
        if(mode==="exam"){if(sel){s.textContent=sel+". "+item.opts[sel];s.classList.add("ok");s.style.cssText="border-style:solid;border-color:var(--brand);background:var(--brand-soft);color:var(--brand)"}else s.style.cssText=""}
        else if(sel!=null||mode==="review"){
          const ok=sel===q.ans;s.style.cssText="";
          s.classList.add(ok?"ok":"bad");
          s.textContent=(sel?sel+". "+item.opts[sel]:"—")+(ok?"":"  →  "+q.ans+". "+item.opts[q.ans]);
        }
      };
      paints.push(p);p();
    });
    root.append(list);
  }
  return{el:root,paints,first(){const b=root.querySelector("button:not([disabled])");b&&b.focus({preventScroll:true})}};
}

function route(){
  stopTimer();document.body.classList.remove("exam");
  const parts=(location.hash||"#/").replace(/^#\/?/,"").split("/").filter(Boolean);
  nav();
  const [a,b,c]=parts;
  if(!a)return viewHome();
  if(a==="practice"){
    if(!b)return viewPracticeIndex();
    if(b==="run")return viewRun();
    if(b==="summary")return viewSummary();
    return viewSetup(b);
  }
  if(a==="mock"){
    if(!b)return viewMockIndex();
    if(b==="result")return viewMockResult();
    if(c==="exam")return viewExam(+b);
    return viewMockIndex();
  }
  if(a==="notebook")return viewNotebook();
  if(a==="stats")return viewStats();
  viewHome();
}

let keyHandler=null;
function viewRun(){
  const ss=S.session;

  const st=ss.states[item.key]||(ss.states[item.key]={sel:item.qs.map(()=>null),done:false});
  const ctrl=renderItem(item,st,"practice",()=>{
    if(!st.done&&st.sel.every(x=>x!=null)){
      st.done=true;const res=item.qs.map((q,i)=>st.sel[i]===q.ans);ss.results[item.key]=res;record(item,res);nav();

    upd();
  });

  const prevBtn=h("button",{class:"btn",type:"button",onclick:()=>go(-1)},t("prev"));

  const upd=()=>{nextBtn.textContent=last?t("finish"):t("next")};upd();
  prevBtn.disabled=ss.idx===0;

    if(d>0&&last){location.hash="#/practice/summary";return}
    ss.idx=Math.min(ss.items.length-1,Math.max(0,ss.idx+d));viewRun();window.scrollTo(0,0);
  }

    h("div",{class:"crumb"},h("a",{href:sessHref(ss.type)},tname(ss.type))," / ",t("of",{i:ss.idx+1,n:ss.items.length})),
    h("div",{class:"qhead"},h("span",{class:"cnt"},(ss.idx+1)+" / "+ss.items.length),h("div",{class:"bar"},h("i",{style:"width:"+pct+"%"})),
      h("a",{class:"btn sm",href:"#/practice/summary"},t("exit"))),
    ctrl.el,
    h("div",{class:"qnav"},prevBtn,h("span",{class:"spacer"}),nextBtn),
    h("p",{class:"muted",style:"margin-top:12px;font-size:.82rem"},t("kb")));
  keyHandler=e=>{
    if(e.target.closest&&e.target.closest("input,select,textarea,dialog"))return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    const k=e.key;
    if(/^[a-fA-F]$/.test(k)){
      const i=st.sel.findIndex(x=>x==null);if(i<0)return;
      const L=k.toUpperCase();if(!item.qs[i].letters.includes(L))return;
      const b=app.querySelectorAll('[data-l="'+L+'"]');
      // click the button belonging to the first unanswered question
      const rows=[...app.querySelectorAll(".qs-list .qr,.qs-list .qrow,.qrow,.optlist")];

      if(item.kind==="reading")target=app.querySelector('.opt[data-l="'+L+'"]');
      else{const all=[...app.querySelectorAll('[data-l="'+L+'"]')];target=all[i]||null}
      if(target&&!target.disabled)target.click();
    }else if(k==="Enter"||k==="ArrowRight"){if(st.sel.every(x=>x!=null)||k==="ArrowRight"){e.preventDefault();go(1)}}
    else if(k==="ArrowLeft"){go(-1)}
  };
}
